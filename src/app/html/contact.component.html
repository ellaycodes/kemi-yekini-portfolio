<footer class="contact theme-ink" *ngIf="contact$ | async as contact">
    <div class="wrap">
        <img class="banner" src="/assets/group_photo.jpeg"
            alt="Invited as an expert by the United Nations to review the Economic Report on Africa, Johannesburg, 2020"
            loading="lazy" />
        <div class="frame">
            <h2 class="display thanks">{{contact.items[0].fields.thankYouText}}</h2>
            <div class="details">
                <p class="label">{{contact.items[0].fields.contactTitle}}</p>
                <p class="name">{{contact.items[0].fields.name}}</p>
                <a *ngFor="let contactMethod of contact.items[0].fields.contactMethod"
                    [href]="'mailto:' + contactMethod.fields.value">{{contactMethod.fields.value}}</a>
            </div>
        </div>
    </div>
</footer>
