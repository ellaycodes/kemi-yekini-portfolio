<section class="bio theme-ink" *ngIf="bio$ | async as bio">
    <div class="photo">
        <img [src]="action(bio.items[0].fields.mainImage.fields.file.url)" alt="" loading="lazy" />
    </div>
    <div class="rows">
        <div class="row" *ngFor="let each of bio.items[0].fields.bio">
            <h2 class="label">{{each.fields.title}}</h2>
            <p>{{each.fields.description.content[0].content[0].value}}</p>
        </div>
    </div>
</section>
