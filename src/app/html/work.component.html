<section class="work theme-ink" *ngIf="work$ | async as work">
    <div class="wrap">
        <h2 class="display title">{{work.items[0].fields.title}}</h2>
        <div class="grid">
            <article class="job" *ngFor="let workCard of work.items[0].fields.workExperienceCard">
                <p class="years">{{workCard.fields.dateFrom}}</p>
                <h3>{{workCard.fields.jobTitle}}</h3>
                <div class="company">
                    <img [src]="action(workCard.fields.logo.fields.file.url)" alt="" loading="lazy" />
                    <p>{{workCard.fields.company}}</p>
                </div>
            </article>
        </div>
    </div>
</section>
