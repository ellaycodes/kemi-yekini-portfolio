<section id="intro" class="intro theme-paper" *ngIf="intro$ | async as intro">
    <div class="wrap grid">
        <div class="text">
            <h2 class="display heading">{{intro.items[0].fields.title}}</h2>
            <p class="statement">{{intro.items[0].fields.description.content[0].content[0].value}}</p>
            <nav class="links" *ngIf="bookmark$ | async as bookmark" aria-label="Profiles">
                <a class="label" *ngFor="let one of bookmark.items[0].fields.bookmarkEntry" [href]="one.fields.link"
                    target="_blank" rel="noopener">{{one.fields.title}}</a>
            </nav>
        </div>
        <figure class="portrait">
            <img [src]="action(intro.items[0].fields.image.fields.file.url)" [alt]="intro.items[0].fields.caption" loading="lazy" />
            <figcaption class="caption">{{intro.items[0].fields.caption}}</figcaption>
        </figure>
    </div>
</section>
