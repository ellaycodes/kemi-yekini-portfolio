<section class="accolades theme-paper" *ngIf="accolades$ | async as accolades">
    <div class="wrap">
        <h2 class="display section-title">{{accolades.items[0].fields.title}}</h2>
        <div class="grid">
            <article class="award" *ngFor="let accolade of accolades.items[0].fields.accolades">
                <div class="laurel">
                    <img src="/assets/leftWreath.png" alt="" loading="lazy" />
                    <h3>{{accolade.fields.title}}</h3>
                    <img src="/assets/rightWreath.png" alt="" loading="lazy" />
                </div>
                <p>{{accolade.fields.description.content[0].content[0].value}}</p>
            </article>
        </div>
    </div>
</section>
