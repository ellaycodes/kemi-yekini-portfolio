<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Forms</title><meta name="robots" content="noindex"></head>
<body>
<!-- Netlify Forms skeleton for the "Invite Kemi to speak" form rendered by the Angular app.
     Field names must match the form in src/app/edition/edition.component.html exactly. -->
<form name="speaking-invitation" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="speaking-invitation" />
  <input type="hidden" name="subject" />
  <input name="bot-field" />
  <input name="name" type="text" />
  <input name="organisation" type="text" />
  <input name="email" type="email" />
  <input name="event" type="text" />
  <input name="date" type="text" />
  <input name="location" type="text" />
  <select name="type"><option>Keynote</option></select>
  <input name="audience" type="text" />
  <select name="fee"><option>To be discussed</option></select>
  <textarea name="message"></textarea>
</form>
</body>
</html>
