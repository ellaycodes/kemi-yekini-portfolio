<section class="gallery theme-ink" *ngIf="gallery$ | async as gallery">
    <div class="wrap">
        <div class="head">
            <h2 class="display section-title">{{gallery.items[0].fields.title}}</h2>
            <div class="controls">
                <button type="button" (click)="scroll(-1)" aria-label="Previous photo">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8" /></svg>
                </button>
                <button type="button" (click)="scroll(1)" aria-label="Next photo">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8" /></svg>
                </button>
            </div>
        </div>
    </div>
    <div class="track" #track>
        <figure class="slide" *ngFor="let imageCard of gallery.items[0].fields.contentCard">
            <img [src]="action(imageCard.fields.image.fields.file.url)" alt="" loading="lazy" />
            <figcaption class="caption" [innerHTML]="transformMarkdownToHTML(imageCard.fields.imageSummary)"></figcaption>
        </figure>
    </div>
</section>
