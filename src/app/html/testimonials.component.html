<section class="testimonials theme-stone" *ngIf="testimonials$ | async as testimonials">
    <div class="wrap">
        <h2 class="display section-title">{{testimonials.items[0].fields.title}}</h2>
        <div class="grid">
            <figure class="quote" *ngFor="let testimonial of testimonials.items[0].fields.testimonial">
                <figcaption>
                    <p class="name">{{testimonial.fields.name}}</p>
                    <p class="role">{{testimonial.fields.jobTitle}}</p>
                </figcaption>
                <blockquote>“{{testimonial.fields.testimonialContent.content[0].content[0].value}}”</blockquote>
            </figure>
        </div>
    </div>
</section>
